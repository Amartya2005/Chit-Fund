# Local development stack: PostgreSQL 16 + ChitKart API.
#
#   cp backend/.env.example backend/.env   # set JWT_SECRET / REFRESH_TOKEN_SECRET
#   docker compose up --build
#
# The API container talks to the "db" service; DATABASE_URL/DIRECT_URL from
# backend/.env are overridden below. To use Supabase instead, run the backend
# without compose (npm run dev) with the Supabase URLs in backend/.env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chitkart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chitkart}
      POSTGRES_DB: ${POSTGRES_DB:-chitkart_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chitkart} -d ${POSTGRES_DB:-chitkart_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chitkart}:${POSTGRES_PASSWORD:-chitkart}@db:5432/${POSTGRES_DB:-chitkart_dev}
      DIRECT_URL: postgresql://${POSTGRES_USER:-chitkart}:${POSTGRES_PASSWORD:-chitkart}@db:5432/${POSTGRES_DB:-chitkart_dev}
    # Apply versioned migrations, then start the API.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
